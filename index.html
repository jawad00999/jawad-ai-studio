
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jawad AI Studio Pro</title>
<style>
:root{color-scheme:dark;--panel:#151d32;--line:#293653;--text:#eef3ff;--muted:#aab6cf;--accent:#6d8cff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0b1020,#111a2e);color:var(--text);font-family:Arial,sans-serif;padding:18px}
.wrap{max-width:900px;margin:auto}
h1{margin:5px 0 8px;font-size:27px}
.sub{color:var(--muted);margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:13px 0}
label{display:block;font-weight:700;margin:10px 0 7px}
textarea,select{width:100%;background:#0d1528;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px}
textarea{min-height:145px;resize:vertical;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button{border:0;border-radius:10px;background:var(--accent);color:white;font-weight:700;padding:12px 15px;font-size:15px;margin:8px 6px 0 0;cursor:pointer}
button.secondary{background:#293653}
button:disabled{opacity:.5}
#status{color:#c6d4f5;white-space:pre-wrap;line-height:1.5;margin-top:10px}
#preview{width:100%;aspect-ratio:16/9;background:#080d18;border-radius:12px}
.scene{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.scene img{width:110px;height:70px;object-fit:cover;border-radius:8px;background:#080d18}
.small{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:5px}
@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:1fr}.scene{grid-template-columns:85px 1fr}.scene img{width:85px;height:65px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Jawad AI Studio Pro</h1>
<p class="sub">Create AI videos with matching images and narration.</p>

<div class="panel">
<label>Your video script</label>
<textarea id="script" placeholder="Paste your complete video script here..."></textarea>

<div class="grid">
<div>
<label>Narration language</label>
<select id="language">
<option>English</option>
<option>Hindi</option>
</select>
</div>

<div>
<label>Voice type</label>
<select id="gender">
<option value="female">Female</option>
<option value="male">Male</option>
<option value="all">All voices</option>
</select>
</div>

<div>
<label>Choose voice by name</label>
<select id="voice">
<option value="">Loading voices...</option>
</select>
</div>

<div>
<label>Video format</label>
<select id="ratio">
<option value="16:9">Landscape 16:9</option>
<option value="9:16">Portrait 9:16</option>
</select>
</div>
</div>

<div class="actions">
<button id="loadVoices" class="secondary">Reload voice names</button>
<button id="makeScenes">Generate matching images</button>
</div>
<div id="status">Connecting to services...</div>
</div>

<div class="panel">
<label>Video preview</label>
<canvas id="preview" width="1280" height="720"></canvas>
<div class="actions">
<button id="playVoice" class="secondary">Play AI voice</button>
<button id="playPreview">Play video preview</button>
<button id="export">Export / Download video</button>
</div>
<p class="small">Video exports in WebM format. Keep this page open while exporting.</p>
</div>

<div class="panel">
<label>Scenes and images</label>
<div id="scenes">Your scenes will appear here.</div>
</div>
</div>

<script>
const API="https://jawad-ai-api.jawadraja00999.workers.dev/";
const $=id=>document.getElementById(id);

let voices=[],scenes=[],audioBlob=null,audioUrl=null,audioBuffer=null;
let previewTimer=null,previewIndex=0,playingAudio=null;

function status(msg){$("status").textContent=msg;}

function splitScript(text){
return text.replace(/\s+/g," ").trim().split(/(?<=[.!?])\s+/).filter(Boolean);
}

function searchPhrase(sentence){
return sentence.replace(/[^\p{L}\p{N}\s]/gu," ")
.split(/\s+/).filter(w=>w.length>3).slice(0,7).join(" ")
||sentence.slice(0,70);
}

async function loadVoices(){
const select=$("voice");
select.innerHTML='<option>Loading voice names...</option>';

try{
const r=await fetch(API+"?action=voices");
const data=await r.json();

if(!r.ok||!Array.isArray(data.voices)){
throw new Error(data.error||"Voice list unavailable");
}

voices=data.voices;
fillVoiceOptions();
status("Loaded "+voices.length+" voices successfully.");

}catch(e){
select.innerHTML='<option value="">Could not load voices</option>';
status("Voice error: "+e.message);
}
}

function fillVoiceOptions(){
const wanted=$("gender").value;
const select=$("voice");

const filtered=voices.filter(v=>{
const g=(v.labels&&v.labels.gender||"").toLowerCase();
return wanted==="all"||!g||g===wanted;
});

select.innerHTML="";

filtered.forEach(v=>{
const op=document.createElement("option");
op.value=v.voice_id;
const gender=v.labels&&v.labels.gender
?" ("+v.labels.gender+")":"";
op.textContent=(v.name||"Unnamed voice")+gender;
select.appendChild(op);
});

if(!filtered.length){
select.innerHTML='<option value="">No matching voices</option>';
}
}

async function getImage(query){
const r=await fetch(API+"?query="+encodeURIComponent(query));
const data=await r.json();

if(!r.ok||!data.image){
throw new Error(data.error||"No image returned");
}
return data.image;
}

async function generateScenes(){
const text=$("script").value.trim();

if(!text){
status("Please paste your script first.");
return;
}

const lines=splitScript(text).slice(0,24);

scenes=lines.map(text=>({
text,
image:"",
query:searchPhrase(text)
}));

$("scenes").innerHTML="";
renderSceneList();

status("Finding matching images...");

for(let i=0;i<scenes.length;i++){
try{
scenes[i].image=await getImage(scenes[i].query);
updateSceneCard(i);
status("Images found: "+(i+1)+" of "+scenes.length);
}catch(e){
updateSceneCard(i);
status("Image failed for scene "+(i+1)+". Trying next...");
}
}

drawScene(0);
status("Image search finished.");
}

function renderSceneList(){
$("scenes").innerHTML="";

scenes.forEach((s,i)=>{
const div=document.createElement("div");
div.className="scene";
div.id="scene-"+i;

const img=document.createElement("img");
img.alt="Scene "+(i+1);
img.src=s.image||"";

const info=document.createElement("div");
const p=document.createElement("div");
p.textContent=(i+1)+". "+s.text;

const small=document.createElement("div");
small.className="small";
small.textContent="Searching for image...";

info.append(p,small);
div.append(img,info);
$("scenes").appendChild(div);
});
}

function updateSceneCard(i){
const card=$("scene-"+i);
if(!card)return;

const img=card.querySelector("img");
const small=card.querySelector(".small");

img.src=scenes[i].image||"";
small.textContent=scenes[i].image
?"Image loaded":"No image found for this scene";
}

function canvasSize(){
return $("ratio").value==="9:16"
?{w:720,h:1280}
:{w:1280,h:720};
}

function drawCover(ctx,img,w,h){
const scale=Math.max(w/img.width,h/img.height);
const iw=img.width*scale;
const ih=img.height*scale;

ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih);
}

function drawCaption(ctx,text,w,h){
const fontSize=Math.round(w*.038);
ctx.font="bold "+fontSize+"px Arial";

const maxWidth=w*.86;
const words=text.split(/\s+/);
const lines=[];
let line="";

words.forEach(word=>{
const test=line?line+" "+word:word;
if(ctx.measureText(test).width>maxWidth&&line){
lines.push(line);
line=word;
}else{
line=test;
}
});

if(line)lines.push(line);

const shown=lines.slice(0,5);
const lineH=fontSize*1.35;
const boxH=shown.length*lineH+42;
const y=h-boxH-45;

ctx.fillStyle="rgba(0,0,0,.68)";
ctx.fillRect(w*.05,y,w*.9,boxH);
ctx.fillStyle="#fff";
ctx.textAlign="center";

shown.forEach((l,j)=>{
ctx.fillText(l,w/2,y+30+fontSize+j*lineH,w*.84);
});
}

function drawScene(i){
if(!scenes.length)return;

const c=$("preview");
const ctx=c.getContext("2d");
const size=canvasSize();

c.width=size.w;
c.height=size.h;

ctx.fillStyle="#101827";
ctx.fillRect(0,0,c.width,c.height);

const s=scenes[i%scenes.length];

if(s.image){
const img=new Image();
img.crossOrigin="anonymous";

img.onload=()=>{
drawCover(ctx,img,c.width,c.height);
drawCaption(ctx,s.text,c.width,c.height);
};

img.onerror=()=>{
drawCaption(ctx,s.text,c.width,c.height);
};

img.src=s.image;
}else{
drawCaption(ctx,s.text,c.width,c.height);
}
}

async function makeAudio(){
const text=$("script").value.trim();
const voiceId=$("voice").value;

if(!text)throw new Error("Paste your script first.");
if(!voiceId)throw new Error("Select a voice name first.");

status("Generating AI narration...");

const r=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text,voiceId})
});

if(!r.ok){
let msg="Voice generation failed ("+r.status+").";
try{
const d=await r.json();
if(d.error)msg=d.error;
}catch(e){}
throw new Error(msg);
}

audioBlob=await r.blob();

if(audioUrl)URL.revokeObjectURL(audioUrl);
audioUrl=URL.createObjectURL(audioBlob);

const ctx=new (window.AudioContext||window.webkitAudioContext)();
audioBuffer=await ctx.decodeAudioData(await audioBlob.arrayBuffer());
await ctx.close();

status("AI voice generated successfully.");
return audioBlob;
}

async function playVoice(){
try{
if(!audioBlob)await makeAudio();

if(playingAudio){
playingAudio.pause();
}

playingAudio=new Audio(audioUrl);
await playingAudio.play();

status("Playing AI narration.");
}catch(e){
status("Voice error: "+e.message);
}
}

async function playPreview(){
if(!scenes.length){
status("Generate images first.");
return;
}

try{
if(!audioBlob)await makeAudio();
}catch(e){
status("Voice error: "+e.message);
return;
}

if(playingAudio)playingAudio.pause();

playingAudio=new Audio(audioUrl);
playingAudio.play().catch(e=>status(e.message));

previewIndex=0;
drawScene(0);

clearInterval(previewTimer);

previewTimer=setInterval(()=>{
previewIndex=(previewIndex+1)%scenes.length;
drawScene(previewIndex);
},3500);

playingAudio.onended=()=>clearInterval(previewTimer);
}

function downloadBlob(blob,filename){
const url=URL.createObjectURL(blob);
const a=document.createElement("a");

a.href=url;
a.download=filename;
a.style.display="none";

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>URL.revokeObjectURL(url),60000);
}

async function exportVideo(){
if(!scenes.length){
status("Generate images first.");
return;
}

if(!window.MediaRecorder||!$("preview").captureStream){
status("Video export is not supported in this browser. Try Chrome.");
return;
}

$("export").disabled=true;

let audioCtx=null;
let combined=null;
let videoStream=null;

try{
if(!audioBuffer)await makeAudio();

const canvas=$("preview");
const size=canvasSize();

canvas.width=size.w;
canvas.height=size.h;

audioCtx=new (window.AudioContext||window.webkitAudioContext)();
await audioCtx.resume();

const source=audioCtx.createBufferSource();
source.buffer=audioBuffer;

const audioDest=audioCtx.createMediaStreamDestination();
source.connect(audioDest);

videoStream=canvas.captureStream(30);

combined=new MediaStream([
...videoStream.getVideoTracks(),
...audioDest.stream.getAudioTracks()
]);

const mime=[
"video/webm;codecs=vp9,opus",
"video/webm;codecs=vp8,opus",
"video/webm"
].find(t=>MediaRecorder.isTypeSupported(t));

if(!mime)throw new Error("WebM recording is not supported.");

const recorder=new MediaRecorder(combined,{mimeType:mime});
const chunks=[];

recorder.ondataavailable=e=>{
if(e.data&&e.data.size)chunks.push(e.data);
};

const finished=new Promise((resolve,reject)=>{
recorder.onstop=resolve;
recorder.onerror=()=>reject(new Error("Recording failed."));
});

const duration=audioBuffer.duration;
let index=0;

async function showNext(){
const s=scenes[index];

await new Promise(resolve=>{
if(!s.image){
drawScene(index);
resolve();
return;
}

const img=new Image();
img.crossOrigin="anonymous";

img.onload=()=>{
const ctx=canvas.getContext("2d");
ctx.fillStyle="#101827";
ctx.fillRect(0,0,canvas.width,canvas.height);
drawCover(ctx,img,canvas.width,canvas.height);
drawCaption(ctx,s.text,canvas.width,canvas.height);
resolve();
};

img.onerror=()=>{
drawScene(index);
resolve();
};

img.src=s.image;
});
}

await showNext();

recorder.start(500);
status("Recording video. Please keep this page open.");

source.start();

const start=Date.now();

while(Date.now()-start<duration*1000){
const nextIndex=Math.min(
scenes.length-1,
Math.floor(((Date.now()-start)/1000)/(duration/scenes.length))
);

if(nextIndex!==index){
index=nextIndex;
await showNext();
}

await new Promise(r=>setTimeout(r,150));
}

recorder.stop();
await finished;

const blob=new Blob(chunks,{type:"video/webm"});

if(!blob.size){
throw new Error("Video file is empty. Try again.");
}

downloadBlob(blob,"jawad-ai-studio-video.webm");

status("Video created. Check Chrome Downloads if it does not appear.");
}catch(e){
status("Export error: "+e.message);
}finally{
if(videoStream)videoStream.getTracks().forEach(t=>t.stop());
if(combined)combined.getTracks().forEach(t=>t.stop());
if(audioCtx)await audioCtx.close();
$("export").disabled=false;
}
}

$("loadVoices").addEventListener("click",loadVoices);
$("gender").addEventListener("change",fillVoiceOptions);
$("makeScenes").addEventListener("click",generateScenes);
$("playVoice").addEventListener("click",playVoice);
$("playPreview").addEventListener("click",playPreview);
$("export").addEventListener("click",exportVideo);

$("ratio").addEventListener("change",()=>{
if(scenes.length)drawScene(previewIndex);
});

loadVoices();
</script>
</body>
</html>
