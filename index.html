
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionMind AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#0c1220;color:#fff;font-family:Arial,sans-serif}
.container{max-width:700px;margin:auto}
h1{text-align:center;color:#60a5fa}
.subtitle{text-align:center;color:#aab4c8}
.panel{background:#182235;border:1px solid #334155;border-radius:15px;padding:18px;margin:18px 0}
label{display:block;margin:14px 0 7px;font-weight:bold}
input,textarea,select{width:100%;padding:13px;border-radius:9px;border:1px solid #475569;background:#0c1424;color:white;font-size:15px}
textarea{min-height:110px}
button{width:100%;padding:15px;margin-top:16px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
#status{text-align:center;color:#93c5fd;white-space:pre-wrap;line-height:1.5}
video{width:100%;max-height:500px;background:#000;border-radius:12px}
#download{display:none;color:#86efac;text-align:center;display:none;margin-top:15px}
.note{font-size:12px;color:#aab4c8;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>MotionMind AI</h1>
<p class="subtitle">AI Video Generator</p>

<div class="panel">
<label>Video Topic</label>
<input id="topic" placeholder="Example: Amazing Facts About Bees">

<label>Describe Your Video Scene</label>
<textarea id="prompt" placeholder="A cinematic 3D animation of honeybees flying around a colorful flower garden, realistic details, smooth camera movement, natural lighting."></textarea>

<label>Video Format</label>
<select id="ratio">
<option value="9:16">Vertical 9:16 - Shorts</option>
<option value="16:9">Horizontal 16:9</option>
</select>

<button id="generate">Generate AI Video</button>
<p class="note">Test version: generates a 3-second AI video clip. Generation uses your Magic Hour account credits.</p>
</div>

<div class="panel">
<h3>Video Preview</h3>
<video id="preview" controls playsinline></video>
<p id="status">Ready to generate.</p>
<a id="download" download="motionmind-video.mp4">Download Video</a>
</div>
</div>

<script>
const API="https://jawad-ai-api.jawadraja00999.workers.dev/";
const button=document.getElementById("generate");
const statusBox=document.getElementById("status");
const preview=document.getElementById("preview");
const download=document.getElementById("download");

function status(message){
  statusBox.textContent=message;
}

function getVideoUrl(data){
  const files=data.downloads;
  if(Array.isArray(files)){
    const item=files.find(x=>x.url||x.download_url);
    if(item)return item.url||item.download_url;
  }
  if(typeof files==="string")return files;
  return data.download_url||data.video_url||data.url||null;
}

async function checkStatus(id){
  for(let i=0;i<90;i++){
    await new Promise(resolve=>setTimeout(resolve,4000));

    status("Rendering your video... Please wait.");

    const response=await fetch(
      API+"status?id="+encodeURIComponent(id)
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||"Status check failed.");
    }

    if(data.status==="complete"){
      const videoUrl=getVideoUrl(data);
      if(!videoUrl)throw new Error("Video completed, but no download URL was returned.");
      return videoUrl;
    }

    if(data.status==="error"||data.status==="canceled"){
      throw new Error(data.error?.message||data.error||"Video generation failed.");
    }
  }

  throw new Error("Generation is taking longer than expected. Check again later.");
}

button.addEventListener("click",async()=>{
  const topic=document.getElementById("topic").value.trim();
  const prompt=document.getElementById("prompt").value.trim();
  const ratio=document.getElementById("ratio").value;

  if(!topic||!prompt){
    status("Please enter a topic and scene description.");
    return;
  }

  button.disabled=true;
  download.style.display="none";
  preview.removeAttribute("src");
  preview.load();

  try{
    status("Submitting your video request...");

    const response=await fetch(API+"generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        prompt:prompt+" Topic: "+topic+". Cinematic 3D animation, smooth movement, detailed environment."
      })
    });

    const created=await response.json();

    if(!response.ok){
      throw new Error(created.error||created.message||"Video request failed.");
    }

    const id=created.id||created.project_id||created.project?.id;

    if(!id){
      throw new Error("Project ID missing. Server response: "+JSON.stringify(created));
    }

    status("Request accepted. Project ID: "+id);

    const videoUrl=await checkStatus(id);

    preview.src=videoUrl;
    download.href=videoUrl;
    download.style.display="block";

    status("Your AI video is ready!");

  }catch(error){
    status("Error: "+error.message);
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
