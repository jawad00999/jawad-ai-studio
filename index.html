
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jawad AI Studio Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial}
header{text-align:center;padding:20px;background:#111a2d}
h1{color:#65a8ff}
main{max-width:900px;margin:auto;padding:15px}
.card{background:#111a2d;padding:16px;border-radius:12px;margin:15px 0}
textarea,select,button{width:100%;padding:12px;margin:7px 0;border-radius:8px}
textarea,select{background:#080d18;color:white;border:1px solid #354767}
textarea{height:150px}
button{background:#2878e7;color:white;border:0;font-weight:bold}
button:active{background:#1554a8}
canvas{width:100%;border-radius:10px;background:#080d18}
#gallery img{width:100%;border-radius:10px;margin-top:10px}
#status{color:#80b7ff;white-space:pre-wrap}
a{color:#80b7ff}
.scene{margin:15px 0;padding:10px;background:#080d18;border-radius:10px}
</style>
</head>
<body>

<header>
<h1>Jawad AI Studio Pro</h1>
<p>Automatic AI Explainer Video Maker</p>
</header>

<main>

<div class="card">
<h3>Write Your Script</h3>

<textarea id="script" placeholder="Write your English or Hindi script here..."></textarea>

<label>Language</label>
<select id="language">
<option value="en">English</option>
<option value="hi">Hindi</option>
</select>

<label>Voice Type</label>
<select id="voiceType">
<option value="female">Female Voice</option>
<option value="male">Male Voice</option>
</select>

<label>Video Format</label>
<select id="format">
<option value="landscape">YouTube 16:9</option>
<option value="portrait">Shorts 9:16</option>
</select>

<label>Video Duration</label>
<select id="duration">
<option value="30">30 Seconds</option>
<option value="60">1 Minute</option>
<option value="120">2 Minutes</option>
<option value="180">3 Minutes</option>
</select>

<button onclick="createVideo()">Create Video</button>
<button onclick="playVoice()">Play Voice</button>
<button onclick="stopVoice()">Stop Voice</button>

<p id="status">Ready.</p>
</div>

<div class="card">
<h3>Automatic Scene Pictures</h3>
<div id="gallery"></div>
</div>

<div class="card">
<h3>Video Preview</h3>
<canvas id="canvas" width="1280" height="720"></canvas>
<button onclick="playPreview()">Play Preview + Voice</button>
<button onclick="stopPreview()">Stop Preview + Voice</button>
<button onclick="exportVideo()">Download Video</button>
</div>

</main>

<script>
const API="https://jawad-ai-api.jawadraja00999.workers.dev/";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let scenes=[];
let playing=false;
let previewTimer=null;
let exportTimer=null;

const stopWords=[
"the","is","are","was","were","a","an","and","or","but",
"to","of","in","on","at","for","with","from","by","as",
"this","that","these","those","it","its","they","them",
"he","she","his","her","we","you","your","their",
"what","when","where","why","how","who","which",
"एक","और","है","हैं","था","थी","थे","को","का","की",
"के","में","पर","से","यह","वह","इस","उस","जो","कि",
"और","भी","तो","अगर","लेकिन","क्यों","कैसे","क्या",
"होता","होती","होते","करता","करती","करते"
];

function splitText(text){
return text.match(/[^.!?।]+[.!?।]?/g)
?.map(x=>x.trim()).filter(Boolean)||[];
}

function buildImageQuery(sentence){

let words=sentence
.toLowerCase()
.replace(/[^\p{L}\p{N}\s]/gu," ")
.split(/\s+/)
.filter(word=>word.length>2&&!stopWords.includes(word));

let unique=[...new Set(words)];

return unique.slice(0,6).join(" ")||sentence.slice(0,80);

}

function stopVoice(){
if("speechSynthesis" in window){
speechSynthesis.cancel();
}
}

function playVoice(){

let text=document.getElementById("script").value.trim();

if(!text){
alert("Please write your script first.");
return;
}

if(!("speechSynthesis" in window)){
alert("Voice is not supported in this browser.");
return;
}

stopVoice();

let lang=document.getElementById("language").value;
let type=document.getElementById("voiceType").value;

let utterance=new SpeechSynthesisUtterance(text);

utterance.lang=lang==="hi"?"hi-IN":"en-US";
utterance.rate=0.92;
utterance.pitch=type==="female"?1.1:0.9;

let voices=speechSynthesis.getVoices();

let matching=voices.filter(v=>
v.lang.toLowerCase().startsWith(lang)
);

let preferred=matching.find(v=>{
let name=v.name.toLowerCase();

return type==="female"
?/female|zira|samantha/i.test(name)
:/male|david|mark|daniel/i.test(name);
});

if(preferred){
utterance.voice=preferred;
}else if(matching.length){
utterance.voice=matching[0];
}

speechSynthesis.speak(utterance);

}

function safe(s){
return String(s||"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[c]);
}

async function createVideo(){

let text=document.getElementById("script").value.trim();

if(!text){
alert("Write your script first.");
return;
}

stopPreview();
stopVoice();

scenes=[];

document.getElementById("gallery").innerHTML="";

let sentences=splitText(text).slice(0,20);

document.getElementById("status").textContent=
"Finding matching pictures...";

try{

for(let i=0;i<sentences.length;i++){

let query=buildImageQuery(sentences[i]);

document.getElementById("status").textContent=
"Finding picture "+(i+1)+" of "+sentences.length+
"\nSearching: "+query;

let response=await fetch(
API+"?query="+encodeURIComponent(query)
);

if(!response.ok){
throw Error("Image search failed. Please try again.");
}

let data=await response.json();

let photo=data.images?.[0];
let img=null;

if(photo){

img=new Image();
img.crossOrigin="anonymous";
img.src=photo.image;

await new Promise(resolve=>{
img.onload=resolve;
img.onerror=resolve;
});

}

scenes.push({
text:sentences[i],
image:img,
photo:photo
});

let div=document.createElement("div");
div.className="scene";

let heading=document.createElement("p");
heading.textContent="Scene "+(i+1)+": "+sentences[i];
div.appendChild(heading);

if(photo){

let picture=document.createElement("img");
picture.src=photo.image;
picture.alt=query;

div.appendChild(picture);

let credit=document.createElement("p");

credit.innerHTML=
'Photo by <a target="_blank" href="'+
safe(photo.credit)+'">'+
safe(photo.photographer)+
'</a> on <a target="_blank" href="'+
safe(photo.source)+'">Unsplash</a>';

div.appendChild(credit);

}else{

let noImage=document.createElement("p");
noImage.textContent="No matching picture found for this scene.";
div.appendChild(noImage);

}

document.getElementById("gallery").appendChild(div);

}

drawScene(0);

document.getElementById("status").textContent=
"Done! "+scenes.length+" scenes created.";

}catch(e){

document.getElementById("status").textContent=
"Error: "+e.message;

}

}

function drawScene(i){

if(!scenes.length)return;

let s=scenes[i];
let w=canvas.width;
let h=canvas.height;

ctx.fillStyle="#101b30";
ctx.fillRect(0,0,w,h);

if(s.image&&s.image.complete&&s.image.naturalWidth){

let scale=Math.max(
w/s.image.width,
h/s.image.height
);

let iw=s.image.width*scale;
let ih=s.image.height*scale;

ctx.drawImage(
s.image,
(w-iw)/2,
(h-ih)/2,
iw,
ih
);

}

ctx.fillStyle="rgba(0,0,0,.78)";
ctx.fillRect(0,h*.62,w,h*.38);

ctx.fillStyle="white";
ctx.textAlign="center";
ctx.font="bold "+Math.round(w*.04)+"px Arial";

let words=s.text.split(/\s+/);
let lines=[];
let line="";

for(let word of words){

let test=line+word+" ";

if(ctx.measureText(test).width>w*.84&&line){

lines.push(line.trim());
line=word+" ";

}else{

line=test;

}

}

if(line)lines.push(line.trim());

let lineHeight=w*.05;
let start=h*.80-(lines.length*lineHeight)/2;

lines.forEach((l,n)=>{
ctx.fillText(l,w/2,start+n*lineHeight);
});

ctx.font="bold 22px Arial";
ctx.fillStyle="#9bc9ff";
ctx.fillText("JAWAD AI STUDIO",w/2,h-25);

}

function playPreview(){

if(!scenes.length){
alert("Create video first.");
return;
}

stopPreview();

playing=true;
playVoice();

let i=0;

function next(){

if(!playing)return;

drawScene(i);

i=(i+1)%scenes.length;

previewTimer=setTimeout(next,3000);

}

next();

}

function stopPreview(){

playing=false;

clearTimeout(previewTimer);
clearTimeout(exportTimer);

stopVoice();

}

function exportVideo(){

if(!scenes.length){
alert("Create video first.");
return;
}

if(!canvas.captureStream||!window.MediaRecorder){
alert("Video export is not supported in this browser.");
return;
}

stopPreview();

let portrait=
document.getElementById("format").value==="portrait";

canvas.width=portrait?720:1280;
canvas.height=portrait?1280:720;

let stream=canvas.captureStream(30);
let chunks=[];

let recorder=new MediaRecorder(stream);

recorder.ondataavailable=e=>{
if(e.data.size){
chunks.push(e.data);
}
};

recorder.onstop=()=>{

let blob=new Blob(chunks,{type:"video/webm"});
let url=URL.createObjectURL(blob);

let a=document.createElement("a");
a.href=url;
a.download="Jawad-AI-Video.webm";
a.click();

URL.revokeObjectURL(url);

document.getElementById("status").textContent=
"Video downloaded!";

};

let duration=
Number(document.getElementById("duration").value)
*1000/scenes.length;

recorder.start();

let i=0;

function next(){

drawScene(i++);

if(i<scenes.length){

exportTimer=setTimeout(next,duration);

}else{

exportTimer=setTimeout(()=>recorder.stop(),duration);

}

}

next();

}
</script>

</body>
</html>
