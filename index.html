
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jawad AI Studio Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101321;color:white;font-family:Arial,sans-serif}
.container{max-width:850px;margin:auto}
h1{text-align:center;color:#65d8ff}
.subtitle{text-align:center;color:#aaa}
.panel{background:#1c2235;padding:16px;border-radius:14px;margin:15px 0}
label{display:block;margin:12px 0 6px}
textarea,select{width:100%;padding:12px;border:1px solid #414b67;border-radius:9px;background:#111729;color:white;font-size:15px}
textarea{height:150px;resize:vertical}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:9px;background:#168ed1;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button.secondary{background:#39445e}
#status{color:#72d8ff;text-align:center;margin:12px}
#canvas{width:100%;background:#080b12;border-radius:12px;display:block}
.scene{background:#111729;padding:10px;border-radius:10px;margin-top:12px}
.scene img{width:100%;border-radius:8px;display:block}
.small{font-size:12px;color:#aaa}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Jawad AI Studio Pro</h1>
<p class="subtitle">AI Explainer Video Creator</p>

<div class="panel">
<label>Your Script</label>
<textarea id="script" placeholder="Write your video script here..."></textarea>

<div class="row">
<div>
<label>Language</label>
<select id="language">
<option value="en">English</option>
<option value="hi">Hindi</option>
</select>
</div>
<div>
<label>Voice Type</label>
<select id="voiceType">
<option value="female">Female</option>
<option value="male">Male</option>
</select>
</div>
</div>

<label>ElevenLabs AI Voice</label>
<select id="voiceSelect">
<option value="">Loading AI voices...</option>
</select>
<p class="small">Choose a male or female AI voice. Hindi and English use multilingual speech.</p>

<div class="row">
<div>
<label>Video Format</label>
<select id="format">
<option value="landscape">16:9 Landscape</option>
<option value="portrait">9:16 Shorts</option>
</select>
</div>
<div>
<label>Video Duration</label>
<select id="duration">
<option value="30">30 Seconds</option>
<option value="60">1 Minute</option>
<option value="120">2 Minutes</option>
<option value="180">3 Minutes</option>
</select>
</div>
</div>

<button onclick="createVideo()">Generate Video Scenes</button>
<button class="secondary" onclick="playVoice()">Test AI Voice</button>
<button class="secondary" onclick="playPreview()">Play Preview + AI Voice</button>
<button class="secondary" onclick="stopPreview()">Stop Preview</button>
<button class="secondary" onclick="exportVideo()">Export Video with Voice</button>
<div id="status">Connecting to AI Studio...</div>
</div>

<div class="panel">
<h3>Video Preview</h3>
<canvas id="canvas" width="1280" height="720"></canvas>
</div>

<div class="panel">
<h3>Generated Images</h3>
<div id="scenes"></div>
</div>
</div>

<script>
const API="https://jawad-ai-api.jawadraja00999.workers.dev/";
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let scenes=[];
let playing=false;
let previewTimer=null;
let currentAudio=null;
let currentAudioURL=null;
let aiVoices=[];

function setStatus(message){
 document.getElementById("status").textContent=message;
}

// LOAD ELEVENLABS VOICES
async function loadAIVoices(){
 const select=document.getElementById("voiceSelect");
 select.innerHTML='<option value="">Loading voices...</option>';

 try{
  const response=await fetch(API+"?action=voices");
  const data=await response.json();

  if(!response.ok)throw new Error(data.error||"Voice loading failed");

  aiVoices=data.voices||[];
  updateVoiceOptions();

  setStatus("Connected! "+aiVoices.length+" AI voices available.");
 }catch(error){
  select.innerHTML='<option value="">Could not load voices</option>';
  setStatus("Voice error: "+error.message);
 }
}

function updateVoiceOptions(){
 const select=document.getElementById("voiceSelect");
 const gender=document.getElementById("voiceType").value;

 const matching=aiVoices.filter(v=>{
  const voiceGender=(v.labels?.gender||"").toLowerCase();
  return !voiceGender||voiceGender===gender;
 });

 select.innerHTML="";

 if(!matching.length){
  select.innerHTML='<option value="">No matching voices found</option>';
  return;
 }

 matching.forEach(v=>{
  const option=document.createElement("option");
  option.value=v.voice_id;
  option.textContent=v.name;
  select.appendChild(option);
 });
}

document.getElementById("voiceType").addEventListener("change",updateVoiceOptions);

async function generateSpeech(text){
 const voiceId=document.getElementById("voiceSelect").value;

 if(!voiceId)throw new Error("Please select an AI voice first.");
 if(text.length>4500)throw new Error("Script is too long for one voice request. Please shorten it.");

 const response=await fetch(API,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({text,voiceId})
 });

 if(!response.ok){
  let message="Speech generation failed.";
  try{
   const data=await response.json();
   message=data.error||message;
  }catch(e){}
  throw new Error(message);
 }

 return await response.blob();
}

function stopVoice(){
 if(currentAudio){
  currentAudio.pause();
  currentAudio.src="";
  currentAudio=null;
 }
 if(currentAudioURL){
  URL.revokeObjectURL(currentAudioURL);
  currentAudioURL=null;
 }
}

async function playVoice(){
 const text=document.getElementById("script").value.trim();
 if(!text){setStatus("Please enter your script first.");return}

 stopVoice();
 setStatus("Generating natural AI voice...");

 try{
  const blob=await generateSpeech(text);
  currentAudioURL=URL.createObjectURL(blob);
  currentAudio=new Audio(currentAudioURL);

  currentAudio.onended=()=>{
   setStatus("AI voice finished.");
   stopVoice();
  };

  currentAudio.onerror=()=>{
   setStatus("Audio playback error.");
   stopVoice();
  };

  await currentAudio.play();
  setStatus("Playing ElevenLabs AI voice...");
 }catch(error){
  setStatus("Voice error: "+error.message);
 }
}

const stopWords=[
 "the","is","are","was","were","and","or","to","of","in","on",
 "a","an","for","with","this","that","it","as","by","from",
 "what","why","how","when","where","who","will","can","could",
 "have","has","had","be","been","being","your","you","we","they",
 "he","she","his","her","their","our","but","if","so","then",
 "एक","और","का","की","के","है","हैं","को","में","से","यह","वह"
];

function splitText(text){
 return text.replace(/\n+/g," ")
 .split(/(?<=[.!?।])\s+/)
 .map(s=>s.trim()).filter(Boolean);
}

function buildImageQuery(sentence){
 const words=sentence
 .replace(/[^\p{L}\p{N}\s]/gu," ")
 .split(/\s+/)
 .filter(w=>w.length>2&&!stopWords.includes(w.toLowerCase()));

 return words.slice(0,6).join(" ")||"technology science education";
}

async function getImage(query){
 try{
  const response=await fetch(API+"?query="+encodeURIComponent(query));
  if(!response.ok)return null;
  const data=await response.json();
  return data.image?data:null;
 }catch(error){
  console.error("Image API error:",error);
  return null;
 }
}

async function createVideo(){
 const text=document.getElementById("script").value.trim();
 if(!text){setStatus("Please write a script first.");return}

 stopPreview();
 scenes=[];

 const sentences=splitText(text).slice(0,20);
 const sceneBox=document.getElementById("scenes");
 sceneBox.innerHTML="";

 for(let i=0;i<sentences.length;i++){
  setStatus("Finding images: "+(i+1)+" / "+sentences.length);

  const imageData=await getImage(buildImageQuery(sentences[i]));
  const imageUrl=imageData?.image||"";

  const scene={
   text:sentences[i],
   image:imageUrl,
   photo:imageData?.photographer||""
  };

  scenes.push(scene);

  const div=document.createElement("div");
  div.className="scene";

  if(imageUrl){
   const img=document.createElement("img");
   img.src=imageUrl;
   img.alt=sentences[i];
   img.loading="lazy";
   div.appendChild(img);
  }else{
   const error=document.createElement("p");
   error.textContent="Image not found for this scene.";
   div.appendChild(error);
  }

  const caption=document.createElement("p");
  caption.textContent=sentences[i];
  div.appendChild(caption);

  if(scene.photo){
   const credit=document.createElement("p");
   credit.className="small";
   credit.textContent="Photo: "+scene.photo;
   div.appendChild(credit);
  }

  sceneBox.appendChild(div);
 }

 if(scenes.length){
  setStatus("Done! "+scenes.length+" scenes generated.");
  drawScene(0);
 }else{
  setStatus("No scenes generated.");
 }
}

function drawCaption(text){
 const maxWidth=canvas.width*.86;
 const fontSize=canvas.width>800?48:38;
 ctx.font="bold "+fontSize+"px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 const words=text.split(" ");
 const lines=[];
 let line="";

 for(const word of words){
  const test=line?line+" "+word:word;
  if(ctx.measureText(test).width>maxWidth&&line){
   lines.push(line);
   line=word;
  }else{
   line=test;
  }
 }
 if(line)lines.push(line);

 const lineHeight=fontSize*1.3;
 let y=(canvas.height-lines.length*lineHeight)/2;
 ctx.fillStyle="rgba(0,0,0,0.65)";
 ctx.fillRect(0,canvas.height*.55,canvas.width,canvas.height*.45);
 ctx.fillStyle="white";

 lines.forEach(line=>{
  ctx.fillText(line,canvas.width/2,y+lineHeight/2);
  y+=lineHeight;
 });
}

function drawScene(index){
 if(!scenes.length)return;

 const scene=scenes[index];
 const format=document.getElementById("format").value;

 canvas.width=format==="portrait"?720:1280;
 canvas.height=format==="portrait"?1280:720;

 ctx.fillStyle="#080b12";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 if(!scene.image){
  drawCaption(scene.text);
  return;
 }

 const img=new Image();
 img.crossOrigin="anonymous";

 img.onload=()=>{
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  drawCaption(scene.text);
 };

 img.onerror=()=>drawCaption(scene.text);
 img.src=scene.image;
}

async function playPreview(){
 if(!scenes.length){setStatus("Generate scenes first.");return}

 stopPreview();
 playing=true;

 const text=document.getElementById("script").value.trim();
 try{
  setStatus("Generating AI voice...");
  const blob=await generateSpeech(text);
  if(!playing)return;

  currentAudioURL=URL.createObjectURL(blob);
  currentAudio=new Audio(currentAudioURL);
  currentAudio.onended=()=>stopPreview();
  currentAudio.onerror=()=>stopPreview();

  await currentAudio.play();

  let index=0;
  function next(){
   if(!playing)return;
   drawScene(index);
   index=(index+1)%scenes.length;
   previewTimer=setTimeout(next,3000);
  }
  next();
  setStatus("Playing video preview with AI voice...");
 }catch(error){
  stopPreview();
  setStatus("Preview error: "+error.message);
 }
}

function stopPreview(){
 playing=false;
 clearTimeout(previewTimer);
 stopVoice();
 setStatus("Preview stopped.");
}

async function exportVideo(){
 if(!scenes.length){setStatus("Generate scenes first.");return}
 if(!window.MediaRecorder||!canvas.captureStream){
  setStatus("Video export is not supported in this browser.");
  return;
 }

 stopPreview();
 setStatus("Generating narration for export...");

 let audioContext;
 let stream;
 let recorder;
 let audio;

 try{
  const text=document.getElementById("script").value.trim();
  const blob=await generateSpeech(text);
  const audioURL=URL.createObjectURL(blob);

  audio=new Audio(audioURL);
  audioContext=new AudioContext();
  await audioContext.resume();

  const source=audioContext.createMediaElementSource(audio);
  const destination=audioContext.createMediaStreamDestination();

  source.connect(destination);
  source.connect(audioContext.destination);

  stream=canvas.captureStream(30);
  destination.stream.getAudioTracks().forEach(track=>stream.addTrack(track));

  try{
   recorder=new MediaRecorder(stream,{mimeType:"video/webm"});
  }catch(e){
   recorder=new MediaRecorder(stream);
  }

  const chunks=[];
  recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
  };

  recorder.onstop=()=>{
   const videoBlob=new Blob(chunks,{type:"video/webm"});
   const downloadURL=URL.createObjectURL(videoBlob);
   const a=document.createElement("a");
   a.href=downloadURL;
   a.download="Jawad-AI-Video.webm";
   a.click();

   setTimeout(()=>URL.revokeObjectURL(downloadURL),2000);
   URL.revokeObjectURL(audioURL);
   stream.getTracks().forEach(track=>track.stop());
   audioContext.close();
   setStatus("Video exported with narration!");
  };

  recorder.start();

  let index=0;
  const duration=Number(document.getElementById("duration").value);
  const sceneTime=duration/scenes.length;
  let visualFinished=false;
  let audioFinished=false;
  let stopped=false;

  function finishIfReady(){
   if(visualFinished&&audioFinished&&!stopped){
    stopped=true;
    recorder.stop();
   }
  }

  audio.onended=()=>{
   audioFinished=true;
   finishIfReady();
  };

  audio.onerror=()=>{
   audioFinished=true;
   finishIfReady();
  };

  function next(){
   if(index>=scenes.length){
    visualFinished=true;
    finishIfReady();
    return;
   }

   drawScene(index);
   index++;
   setTimeout(next,sceneTime*1000);
  }

  audio.play().catch(()=>{
   audioFinished=true;
   finishIfReady();
  });

  setStatus("Exporting video with AI narration...");
  next();

 }catch(error){
  if(stream)stream.getTracks().forEach(track=>track.stop());
  if(audioContext)audioContext.close();
  setStatus("Export error: "+error.message);
 }
}

loadAIVoices();
</script>
</body>
</html>
