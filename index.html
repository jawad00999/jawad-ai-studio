
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jawad AI Studio Pro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #10131d;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #60a5fa;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #aab2c5;
  margin-bottom: 25px;
}

.panel {
  background: #1b2130;
  border: 1px solid #30394c;
  border-radius: 14px;
  padding: 17px;
  margin-bottom: 16px;
}

label {
  display: block;
  margin: 13px 0 7px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #414c63;
  background: #101725;
  color: white;
  font-size: 15px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: 0;
  border-radius: 9px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.secondary {
  background: #374151;
}

#status {
  text-align: center;
  color: #93c5fd;
  margin: 15px 0;
  white-space: pre-wrap;
}

#preview {
  width: 100%;
  max-height: 450px;
  background: black;
  border-radius: 12px;
  margin-top: 12px;
}

#downloadLink {
  display: none;
  text-align: center;
  padding: 14px;
  background: #15803d;
  color: white;
  text-decoration: none;
  border-radius: 9px;
  margin-top: 14px;
  font-weight: bold;
}

.small {
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>Jawad AI Studio Pro</h1>
<p class="subtitle">AI Informative Video Generator</p>

<div class="panel">

<label>Video Type</label>
<select id="mode">
  <option value="photo">Photo Informative Video</option>
  <option value="cartoon">Cartoon Informative Video</option>
</select>

<label>Video Topic</label>
<input id="topic" placeholder="Example: Amazing Facts About Bees">

<label>Video Script</label>
<textarea id="script" placeholder="Write or paste your video script here..."></textarea>

<label>AI Voice</label>
<select id="voice">
  <option value="">Loading voices...</option>
</select>

<button class="secondary" id="loadVoices">Load AI Voices</button>

<label>Video Duration</label>
<select id="duration">
  <option value="30">30 Seconds</option>
  <option value="60" selected>1 Minute</option>
  <option value="90">90 Seconds</option>
  <option value="120">2 Minutes</option>
</select>

<label>Video Format</label>
<select id="format">
  <option value="vertical">Vertical 9:16 (Shorts/Reels)</option>
  <option value="horizontal">Horizontal 16:9 (YouTube)</option>
</select>

<button id="generate">Generate Video</button>

<p class="small">
Photo mode uses relevant photos. Cartoon mode uses cartoon-style image searches.
Both modes include AI voice and captions.
</p>

</div>

<div class="panel">

<h3>Video Preview</h3>
<video id="preview" controls playsinline></video>

<p id="status">Ready to create your video.</p>

<a id="downloadLink" download="jawad-ai-video.webm">
Download Your Video
</a>

</div>

</div>

<script>
const API = "https://jawad-ai-api.jawadraja00999.workers.dev/";

const modeSelect = document.getElementById("mode");
const voiceSelect = document.getElementById("voice");
const statusBox = document.getElementById("status");
const generateButton = document.getElementById("generate");
const preview = document.getElementById("preview");
const downloadLink = document.getElementById("downloadLink");

let availableVoices = [];

function setStatus(message) {
  statusBox.textContent = message;
}

async function loadVoices() {
  voiceSelect.innerHTML = '<option value="">Loading voices...</option>';

  const mode = modeSelect.value;

  try {
    const response = await fetch(
      API + "?action=voices&mode=" + mode
    );

    if (!response.ok) {
      throw new Error("Voice server error: " + response.status);
    }

    const data = await response.json();

    availableVoices = Array.isArray(data.voices)
      ? data.voices
      : [];

    if (!availableVoices.length) {
      throw new Error("No voices found.");
    }

    voiceSelect.innerHTML = "";

    availableVoices.forEach((voice) => {
      const option = document.createElement("option");

      option.value = voice.voice_id;
      option.textContent =
        voice.name + " (" +
        (voice.labels?.language || "") + ", " +
        (voice.labels?.gender || "") + ")";

      voiceSelect.appendChild(option);
    });

    setStatus("AI voices loaded successfully.");

  } catch (error) {
    voiceSelect.innerHTML =
      '<option value="">Voice loading failed</option>';

    setStatus("Voice Error: " + error.message);
  }
}

document.getElementById("loadVoices")
  .addEventListener("click", loadVoices);

modeSelect.addEventListener("change", loadVoices);

async function getImages(topic, mode) {
  const searchTerm = mode === "cartoon"
    ? topic + " cartoon illustration"
    : topic;

  const response = await fetch(
    API + "?query=" + encodeURIComponent(searchTerm)
  );

  if (!response.ok) {
    throw new Error("Image search failed.");
  }

  const data = await response.json();

  const results = Array.isArray(data)
    ? data
    : (data.results || []);

  const images = results
    .map(item =>
      item.urls?.regular ||
      item.urls?.small ||
      item.url ||
      item.image
    )
    .filter(Boolean);

  if (!images.length) {
    throw new Error("No images found for this topic.");
  }

  return images;
}

async function createAudio(script, voiceId) {
  const response = await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      text: script,
      voice: voiceId
    })
  });

  if (!response.ok) {
    const message = await response.text();
    throw new Error("Voice generation failed: " + message);
  }

  const blob = await response.blob();

  if (!blob.size) {
    throw new Error("Audio file is empty.");
  }

  return blob;
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";

    img.onload = () => resolve(img);
    img.onerror = () => reject(
      new Error("An image could not be loaded.")
    );

    img.src = url;
  });
}

function drawImageCover(ctx, img, width, height) {
  const scale = Math.max(
    width / img.width,
    height / img.height
  );

  const w = img.width * scale;
  const h = img.height * scale;

  ctx.drawImage(
    img,
    (width - w) / 2,
    (height - h) / 2,
    w,
    h
  );
}

function drawCaption(ctx, text, width, height) {
  const maxWidth = width - 50;
  const words = text.split(/\s+/);
  const lines = [];
  let line = "";

  ctx.font = "bold 32px Arial";

  for (const word of words) {
    const test = line ? line + " " + word : word;

    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }

  if (line) lines.push(line);

  const shownLines = lines.slice(0, 3);
  const lineHeight = 40;
  const boxHeight = shownLines.length * lineHeight + 35;
  const y = height - boxHeight - 35;

  ctx.fillStyle = "rgba(0,0,0,0.72)";
  ctx.fillRect(15, y, width - 30, boxHeight);

  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  shownLines.forEach((lineText, index) => {
    ctx.fillText(
      lineText,
      width / 2,
      y + 22 + index * lineHeight,
      maxWidth
    );
  });
}

async function makeVideo(script, images, audioBlob, duration, format) {
  const canvas = document.createElement("canvas");

  const width = format === "vertical" ? 720 : 1280;
  const height = format === "vertical" ? 1280 : 720;

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  const audioUrl = URL.createObjectURL(audioBlob);
  const audio = new Audio(audioUrl);
  audio.crossOrigin = "anonymous";

  const audioStream = audio.captureStream
    ? audio.captureStream()
    : null;

  if (!audioStream) {
    throw new Error(
      "Audio recording is not supported by this browser."
    );
  }

  const canvasStream = canvas.captureStream(30);

  const tracks = [
    ...canvasStream.getVideoTracks(),
    ...audioStream.getAudioTracks()
  ];

  const combinedStream = new MediaStream(tracks);

  const mimeType = MediaRecorder.isTypeSupported(
    "video/webm;codecs=vp9,opus"
  )
    ? "video/webm;codecs=vp9,opus"
    : "video/webm";

  const recorder = new MediaRecorder(
    combinedStream,
    { mimeType }
  );

  const chunks = [];

  recorder.ondataavailable = event => {
    if (event.data.size > 0) {
      chunks.push(event.data);
    }
  };

  const videoBlobPromise = new Promise((resolve, reject) => {
    recorder.onstop = () => {
      resolve(new Blob(chunks, { type: mimeType }));
    };

    recorder.onerror = () => {
      reject(new Error("Video recording failed."));
    };
  });

  const paragraphs = script
    .split(/(?<=[.!?۔])\s+/)
    .filter(Boolean);

  const captions = paragraphs.length
    ? paragraphs
    : [script];

  const sceneDuration = duration / images.length;

  let currentImageIndex = 0;
  let currentImage = await loadImage(images[0]);

  const imageCache = {};

  async function getSceneImage(index) {
    if (!imageCache[index]) {
      imageCache[index] = await loadImage(
        images[index % images.length]
      );
    }

    return imageCache[index];
  }

  const startTime = performance.now();

  function renderFrame(now) {
    const elapsed = (now - startTime) / 1000;

    currentImageIndex = Math.min(
      images.length - 1,
      Math.floor(elapsed / sceneDuration)
    );

    if (currentImageIndex !== renderFrame.lastIndex) {
      renderFrame.lastIndex = currentImageIndex;

      getSceneImage(currentImageIndex)
        .then(img => currentImage = img)
        .catch(() => {});
    }

    drawImageCover(ctx, currentImage, width, height);

    const captionIndex = Math.min(
      captions.length - 1,
      Math.floor(elapsed / (duration / captions.length))
    );

    drawCaption(
      ctx,
      captions[captionIndex],
      width,
      height
    );

    if (elapsed < duration && !audio.ended) {
      requestAnimationFrame(renderFrame);
    }
  }

  renderFrame.lastIndex = 0;

  recorder.start();

  await audio.play();

  requestAnimationFrame(renderFrame);

  await new Promise(resolve => {
    audio.onended = resolve;
    audio.onerror = resolve;
  });

  await new Promise(resolve => setTimeout(resolve, 500));

  recorder.stop();

  const videoBlob = await videoBlobPromise;

  URL.revokeObjectURL(audioUrl);

  return videoBlob;
}

generateButton.addEventListener("click", async () => {
  const topic = document.getElementById("topic").value.trim();
  const script = document.getElementById("script").value.trim();
  const voiceId = voiceSelect.value;
  const duration = Number(
    document.getElementById("duration").value
  );
  const format = document.getElementById("format").value;
  const mode = modeSelect.value;

  if (!topic || !script) {
    setStatus("Please enter a topic and video script.");
    return;
  }

  if (!voiceId) {
    setStatus("Please select an AI voice.");
    return;
  }

  generateButton.disabled = true;
  downloadLink.style.display = "none";

  try {
    setStatus("Step 1/3: Finding relevant images...");

    const images = await getImages(topic, mode);

    setStatus("Step 2/3: Generating AI voice...");

    const audioBlob = await createAudio(script, voiceId);

    setStatus("Step 3/3: Creating your video...");

    const videoBlob = await makeVideo(
      script,
      images,
      audioBlob,
      duration,
      format
    );

    const videoUrl = URL.createObjectURL(videoBlob);

    preview.src = videoUrl;

    downloadLink.href = videoUrl;
    downloadLink.style.display = "block";

    setStatus("Your video is ready!");

  } catch (error) {
    setStatus("Error: " + error.message);

  } finally {
    generateButton.disabled = false;
  }
});

loadVoices();
</script>

</body>
</html>
