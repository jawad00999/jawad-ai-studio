
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jawad AI Studio Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#111a2d}
header h1{color:#65a8ff;margin:0}
.container{max-width:950px;margin:22px auto;padding:15px}
.card{background:#111a2d;padding:18px;border:1px solid #26334d;border-radius:14px;margin-bottom:18px}
textarea,select,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #354767;background:#0b1425;color:white;font-size:15px}
textarea{height:150px}
button{background:#2878e7;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
canvas{width:100%;background:#050505;border-radius:12px}
#status{color:#65a8ff;white-space:pre-wrap}
#gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
#gallery img{width:100%;border-radius:8px}
.credit{font-size:11px;color:#b9c6d8;margin-bottom:10px}
</style>
</head>
<body>

<header>
<h1>Jawad AI Studio Pro</h1>
<p>Automatic AI Explainer Video Maker</p>
</header>

<div class="container">
<div class="card">
<h3>Write Your Script</h3>
<textarea id="script" placeholder="Write your video script here..."></textarea>

<label>Video Size</label>
<select id="ratio">
<option value="landscape">16:9 Landscape</option>
<option value="portrait">9:16 Shorts</option>
</select>

<label>Video Duration</label>
<select id="duration">
<option value="30">30 Seconds</option>
<option value="60">1 Minute</option>
<option value="120">2 Minutes</option>
<option value="180">3 Minutes</option>
</select>

<button id="create" onclick="createVideo()">Create Video</button>
<p id="status">Ready to create your video.</p>
</div>

<div class="card">
<h3>Automatic Scene Images</h3>
<div id="gallery"></div>
</div>

<div class="card">
<h3>Video Preview</h3>
<canvas id="video" width="1280" height="720"></canvas>
<button onclick="playPreview()">Play Preview</button>
<button onclick="stopPreview()">Stop Preview</button>
<button onclick="exportVideo()">Export Video</button>
</div>
</div>

<script>
const API="https://jawad-ai-api.jawadraja00999.workers.dev/";
let scenes=[];
let current=0;
let playing=false;
let recorder=null;
let chunks=[];

const canvas=document.getElementById("video");
const ctx=canvas.getContext("2d");

function splitScript(text){
return text.match(/[^.!?]+[.!?]?/g)?.map(x=>x.trim()).filter(Boolean)||[];
}

async function createVideo(){
const script=document.getElementById("script").value.trim();
if(!script){alert("Please write your script first.");return;}

const btn=document.getElementById("create");
btn.disabled=true;
scenes=[];
document.getElementById("gallery").innerHTML="";
document.getElementById("status").textContent="Finding relevant pictures...";

let sentences=splitScript(script).slice(0,5);

try{
for(let i=0;i<sentences.length;i++){
document.getElementById("status").textContent=
"Finding pictures: "+(i+1)+" of "+sentences.length;

let response=await fetch(API+"?query="+encodeURIComponent(sentences[i].slice(0,120)));
let data=await response.json();

if(!response.ok)throw new Error(data.error||"Image search failed");

let photo=data.images?.[0];
let image=null;

if(photo){
image=new Image();
image.crossOrigin="anonymous";
image.src=photo.image;
await new Promise(resolve=>{
image.onload=resolve;
image.onerror=resolve;
});
}

scenes.push({
text:sentences[i],
image:image,
credit:photo?.photographer||"",
creditLink:photo?.credit||"",
source:photo?.source||""
});

if(photo){
let div=document.createElement("div");
let img=document.createElement("img");
img.src=photo.image;
div.appendChild(img);

let credit=document.createElement("div");
credit.className="credit";
credit.innerHTML="Photo by <a target='_blank' href='"+photo.credit+"'>"+
escapeHTML(photo.photographer)+"</a> on <a target='_blank' href='"+photo.source+"'>Unsplash</a>";
div.appendChild(credit);
document.getElementById("gallery").appendChild(div);
}
}

current=0;
drawScene(0);
document.getElementById("status").textContent=
"Done! "+scenes.length+" scenes ready. Pictures and captions loaded.";
}catch(error){
document.getElementById("status").textContent="Error: "+error.message;
}
btn.disabled=false;
}

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);
}

function drawScene(index){
if(!scenes.length)return;
let s=scenes[index];
let w=canvas.width,h=canvas.height;

ctx.fillStyle="#101b30";
ctx.fillRect(0,0,w,h);

if(s.image&&s.image.complete&&s.image.naturalWidth){
let scale=Math.max(w/s.image.width,h/s.image.height);
let iw=s.image.width*scale,ih=s.image.height*scale;
ctx.drawImage(s.image,(w-iw)/2,(h-ih)/2,iw,ih);
}

let gradient=ctx.createLinearGradient(0,h*.35,0,h);
gradient.addColorStop(0,"rgba(0,0,0,0.05)");
gradient.addColorStop(1,"rgba(0,0,0,0.88)");
ctx.fillStyle=gradient;
ctx.fillRect(0,0,w,h);

ctx.fillStyle="white";
ctx.textAlign="center";
ctx.font="bold "+Math.round(w*.045)+"px Arial";

let words=s.text.split(" "),lines=[],line="";
for(let word of words){
let test=line+word+" ";
if(ctx.measureText(test).width>w*.85){
lines.push(line);
line=word+" ";
}else line=test;
}
if(line)lines.push(line);

let lineHeight=Math.round(w*.055);
let start=h*.72-(lines.length*lineHeight)/2;
lines.forEach((l,i)=>ctx.fillText(l.trim(),w/2,start+i*lineHeight));

ctx.font="22px Arial";
ctx.fillStyle="#b9d8ff";
ctx.fillText("JAWAD AI STUDIO",w/2,h-35);
}

function playPreview(){
if(!scenes.length){alert("Create your video first.");return;}
playing=true;
current=0;
showNext();
}

function showNext(){
if(!playing)return;
drawScene(current);
current=(current+1)%scenes.length;
setTimeout(showNext,3000);
}

function stopPreview(){
playing=false;
}

async function exportVideo(){
if(!scenes.length){alert("Create your video first.");return;}
if(!canvas.captureStream||!window.MediaRecorder){
alert("Video export is not supported in this browser.");
return;
}

stopPreview();

let ratio=document.getElementById("ratio").value;
canvas.width=ratio==="portrait"?720:1280;
canvas.height=ratio==="portrait"?1280:720;

let stream=canvas.captureStream(30);
let mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
?"video/webm;codecs=vp9":"video/webm";

chunks=[];
recorder=new MediaRecorder(stream,{mimeType:mime});
recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};

recorder.onstop=()=>{
let blob=new Blob(chunks,{type:"video/webm"});
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;
a.download="Jawad-AI-Video.webm";
a.click();
URL.revokeObjectURL(url);
document.getElementById("status").textContent="Video exported successfully!";
};

let seconds=Number(document.getElementById("duration").value);
let sceneDuration=seconds/scenes.length;

recorder.start();
let i=0;
function next(){
drawScene(i);
i++;
if(i<scenes.length){
setTimeout(next,sceneDuration*1000);
}else{
setTimeout(()=>recorder.stop(),sceneDuration*1000);
}
}
next();
}
</script>
</body>
</html>
