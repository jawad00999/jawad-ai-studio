
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionMind AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#10131d;color:white;font-family:Arial,sans-serif}
.container{max-width:750px;margin:auto}
h1{text-align:center;color:#65d9ff}
.card{background:#1b2130;padding:17px;border-radius:14px;margin:15px 0}
label{display:block;margin:13px 0 7px;font-weight:bold}
input,textarea,select{width:100%;padding:12px;border:1px solid #414b60;border-radius:8px;background:#101725;color:white;font-size:15px}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#168bd0;color:white;font-size:16px;font-weight:bold;margin-top:14px}
button:disabled{opacity:.5}
.secondary{background:#39465c}
.status{color:#8edcff;white-space:pre-wrap;margin-top:12px}
video{width:100%;margin-top:15px;border-radius:10px}
audio{width:100%;margin-top:15px}
small{color:#aab6c9}
</style>
</head>
<body>
<div class="container">

<h1>MotionMind AI</h1>
<p style="text-align:center">Create AI videos with English voice narration</p>

<div class="card">
<h3>🎙️ Voice Settings</h3>

<label>Select English Voice</label>
<select id="voice">
<option value="JBFqnCBsd6RMkjVDRZzb">George - Warm Storyteller</option>
<option value="IKne3meq5aSn9XLyUdCD">Charlie - Deep and Energetic</option>
<option value="onwK4e9ZLuTAKqWW03F9">Daniel - Steady Broadcaster</option>
</select>

<label>English Voice Script</label>
<textarea id="script" placeholder="Enter your English narration here...">Discover amazing facts with MotionMind AI! Subscribe to our channel, like this video, and follow us for more interesting information. Stay curious!</textarea>

<button id="voiceBtn" onclick="generateVoice()">Generate Voice</button>
<div id="voiceStatus" class="status"></div>
<audio id="audioPlayer" controls style="display:none"></audio>
</div>

<div class="card">
<h3>🎬 AI Video Generator</h3>

<label>Video Topic</label>
<input id="topic" value="Subscribe to MotionMind AI">

<label>Scene Description</label>
<textarea id="prompt">Create a cinematic realistic 3D animated YouTube channel promotion. Show a futuristic digital world, glowing information icons, science and technology elements, and an attractive animated subscribe button. Display the text SUBSCRIBE TO MOTIONMIND AI and LIKE FOR MORE. Smooth camera movements and professional lighting.</textarea>

<label>Video Duration (seconds)</label>
<input id="duration" type="number" min="1" max="60" value="3">
<small>Magic Hour estimated cost: 24 credits per second.</small>

<button id="videoBtn" onclick="generateVideo()">Generate Video</button>
<div id="videoStatus" class="status"></div>

<video id="videoPlayer" controls style="display:none"></video>
<a id="download" style="display:none;color:#65d9ff;margin-top:12px" download="MotionMind-video.mp4">Download Video</a>
</div>

</div>

<script>
const API = "https://jawad-ai-api.jawadraja00999.workers.dev/";

async function requestJSON(url, options={}) {
  const response = await fetch(url, options);
  const text = await response.text();

  let data;
  try {
    data = JSON.parse(text);
  } catch {
    throw new Error("Server response is not valid JSON: " + text.slice(0,200));
  }

  if (!response.ok) {
    throw new Error(data.error || data.message || "Request failed: " + response.status);
  }
  return data;
}

async function generateVoice() {
  const btn = document.getElementById("voiceBtn");
  const status = document.getElementById("voiceStatus");
  const player = document.getElementById("audioPlayer");

  const text = document.getElementById("script").value.trim();
  const voice_id = document.getElementById("voice").value;

  if (!text) {
    status.textContent = "Please enter a voice script.";
    return;
  }

  btn.disabled = true;
  status.textContent = "Generating voice...";

  try {
    const data = await requestJSON(API + "tts", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text, voice_id})
    });

    if (!data.audio_base64) {
      throw new Error(data.error || "Audio was not returned by the server.");
    }

    player.src = "data:audio/mpeg;base64," + data.audio_base64;
    player.style.display = "block";
    status.textContent = "Voice generated successfully!";
  } catch (error) {
    status.textContent = "Voice Error: " + error.message;
  } finally {
    btn.disabled = false;
  }
}

async function generateVideo() {
  const btn = document.getElementById("videoBtn");
  const status = document.getElementById("videoStatus");
  const player = document.getElementById("videoPlayer");
  const download = document.getElementById("download");

  const topic = document.getElementById("topic").value.trim();
  const prompt = document.getElementById("prompt").value.trim();
  const duration = Number(document.getElementById("duration").value);

  if (!topic || !prompt) {
    status.textContent = "Please enter a topic and scene description.";
    return;
  }

  if (!Number.isInteger(duration) || duration < 1 || duration > 60) {
    status.textContent = "Duration must be between 1 and 60 seconds.";
    return;
  }

  btn.disabled = true;
  player.style.display = "none";
  download.style.display = "none";

  status.textContent = "Sending video request...";

  try {
    const data = await requestJSON(API + "generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        prompt: prompt + " Video topic: " + topic,
        duration: duration
      })
    });

    const id = data.id || data.project_id || (data.project && data.project.id);

    if (!id) {
      throw new Error(data.error || "Video project ID was not returned.");
    }

    status.textContent = "Video is processing. Please wait...";

    let completed = false;

    for (let i = 0; i < 90; i++) {
      await new Promise(resolve => setTimeout(resolve, 4000));

      const result = await requestJSON(
        API + "status?id=" + encodeURIComponent(id)
      );

      const project = result.project || result;
      const state = String(
        project.status || project.state || ""
      ).toLowerCase();

      const videoUrl =
        project.video_url ||
        project.url ||
        (project.video && project.video.url) ||
        (result.video && result.video.url);

      if (videoUrl && (
        state.includes("complete") ||
        state.includes("success") ||
        state === "completed"
      )) {
        player.src = videoUrl;
        player.style.display = "block";
        download.href = videoUrl;
        download.style.display = "inline-block";
        status.textContent = "Video generated successfully!";
        completed = true;
        break;
      }

      if (["failed","error","canceled","cancelled"].includes(state)) {
        throw new Error(project.error || "Video generation failed.");
      }

      status.textContent = "Video processing... " + (i + 1) + "/90";
    }

    if (!completed) {
      status.textContent = "Still processing. Check again later.";
    }

  } catch (error) {
    status.textContent = "Video Error: " + error.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
