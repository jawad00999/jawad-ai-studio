
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionMind AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#0c1220;color:#fff;font-family:Arial,sans-serif}
.container{max-width:700px;margin:auto}
h1{text-align:center;color:#60a5fa}
.subtitle{text-align:center;color:#aab4c8}
.panel{background:#182235;border:1px solid #334155;border-radius:15px;padding:18px;margin:18px 0}
label{display:block;margin:14px 0 7px;font-weight:bold}
input,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #475569;background:#0c1424;color:white;font-size:15px}
textarea{min-height:150px}
button{width:100%;padding:15px;margin-top:16px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
#status{text-align:center;color:#93c5fd;white-space:pre-wrap;line-height:1.5}
video,audio{width:100%;margin-top:12px}
audio{height:45px}
#download{display:none;color:#86efac;text-align:center;margin-top:15px}
.note{font-size:12px;color:#aab4c8;line-height:1.5}
</style>
</head>
<body>
<div class="container">

<h1>MotionMind AI</h1>
<p class="subtitle">AI Video Generator | THE INFO HUB</p>

<div class="panel">
<label>Video Title</label>
<input id="title" placeholder="Example: Amazing Facts About Space">

<label>Video Description</label>
<textarea id="description" placeholder="Write your video topic and the English narration you want George to speak..."></textarea>

<button id="generate">Generate AI Video + Voice</button>
<p class="note">George English voice. Video duration: 10 seconds. Generation uses your account credits.</p>
</div>

<div class="panel">
<h3>Video Preview</h3>
<video id="preview" controls playsinline></video>

<h3>George Voice Narration</h3>
<audio id="voice" controls></audio>

<p id="status">Ready to generate.</p>
<a id="download" download="motionmind-video.mp4">Download Video</a>
</div>
</div>

<script>
const API="https://jawad-ai-api.jawadraja00999.workers.dev/";
const GEORGE="JBFqnCBsd6RMkjVDRZzb";

const button=document.getElementById("generate");
const statusBox=document.getElementById("status");
const preview=document.getElementById("preview");
const voice=document.getElementById("voice");
const download=document.getElementById("download");

function status(message){
 statusBox.textContent=message;
}

function getVideoUrl(data){
 const files=data.downloads;
 if(Array.isArray(files)){
  const item=files.find(x=>x.url||x.download_url);
  if(item)return item.url||item.download_url;
 }
 if(typeof files==="string")return files;
 return data.download_url||data.video_url||data.url||null;
}

function getAudioBase64(data){
 return data.audio_base64||
        data.voice_audio_base64||
        data.audio?.audio_base64||
        data.audio?.base64||
        null;
}

function playAudio(base64){
 const binary=atob(base64.replace(/^data:audio\/[^;]+;base64,/,""));
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++){
  bytes[i]=binary.charCodeAt(i);
 }
 const blob=new Blob([bytes],{type:"audio/mpeg"});
 voice.src=URL.createObjectURL(blob);
}

async function checkStatus(id){
 for(let i=0;i<90;i++){
  await new Promise(resolve=>setTimeout(resolve,4000));
  status("Rendering your video... Please wait.");

  const response=await fetch(
   API+"status?id="+encodeURIComponent(id)
  );
  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"Status check failed.");
  }

  if(data.status==="complete"){
   const url=getVideoUrl(data);
   if(!url)throw new Error("Video download URL missing.");
   return url;
  }

  if(data.status==="error"||data.status==="canceled"){
   throw new Error(data.error?.message||data.error||"Video generation failed.");
  }
 }
 throw new Error("Generation is taking longer than expected.");
}

button.addEventListener("click",async()=>{
 const title=document.getElementById("title").value.trim();
 const description=document.getElementById("description").value.trim();

 if(!title||!description){
  status("Please enter both Title and Description.");
  return;
 }

 button.disabled=true;
 download.style.display="none";
 preview.removeAttribute("src");
 voice.removeAttribute("src");
 preview.load();
 voice.load();

 try{
  status("Generating George voice and submitting video...");

  const response=await fetch(API+"generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    prompt:title+". "+description+". Create a realistic cinematic 3D educational animation, smooth camera movement, vertical 9:16.",
    narration:description,
    voice_id:GEORGE,
    duration:10
   })
  });

  const created=await response.json();

  if(!response.ok){
   throw new Error(created.error||created.message||"Generation request failed.");
  }

  const audioData=getAudioBase64(created);
  if(audioData){
   playAudio(audioData);
  }else{
   throw new Error("Video request started, but voice audio was not returned by Worker. Check the /generate response.");
  }

  const id=created.id||created.project_id||created.project?.id;
  if(!id)throw new Error("Project ID missing.");

  status("George voice generated. Rendering video...");
  const videoUrl=await checkStatus(id);

  preview.src=videoUrl;
  download.href=videoUrl;
  download.style.display="block";

  status("Your video and George voice are ready! Play the video and voice separately.");

 }catch(error){
  status("Error: "+error.message);
 }finally{
  button.disabled=false;
 }
});
</script>
</body>
</html>
