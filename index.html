
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionMind AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:#0c1220;
  color:#fff;
  font-family:Arial,sans-serif
}
.container{max-width:700px;margin:auto}
h1{text-align:center;color:#60a5fa}
.subtitle{text-align:center;color:#aab4c8}
.panel{
  background:#182235;
  border:1px solid #334155;
  border-radius:15px;
  padding:18px;
  margin:18px 0
}
label{
  display:block;
  margin:16px 0 8px;
  font-weight:bold
}
input,textarea{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #475569;
  background:#0c1424;
  color:white;
  font-size:15px
}
textarea{min-height:110px}
button{
  width:100%;
  padding:15px;
  margin-top:18px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold
}
button:disabled{opacity:.5}
#status{
  text-align:center;
  color:#93c5fd;
  white-space:pre-wrap;
  line-height:1.5
}
video{width:100%;margin-top:12px}
#download{
  display:none;
  color:#86efac;
  margin-top:15px
}
.note{
  font-size:12px;
  color:#aab4c8;
  line-height:1.5
}
.duration{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px
}
#durationValue{
  font-size:25px;
  color:#60a5fa;
  font-weight:bold
}
input[type=range]{
  padding:0;
  accent-color:#3b82f6
}
</style>
</head>

<body>
<div class="container">

<h1>MotionMind AI</h1>
<p class="subtitle">AI Video Generator</p>

<div class="panel">

<h3>Create Your AI Video</h3>

<label>Video Topic</label>
<input id="topic" placeholder="Example: Amazing Facts About Bees">

<label>Describe Your Video Scene</label>
<textarea id="prompt" placeholder="Describe your realistic 3D animated video scene..."></textarea>

<label>Video Duration</label>

<div class="duration">
  <span>Selected time</span>
  <span id="durationValue">3 seconds</span>
</div>

<input
  type="range"
  id="duration"
  min="1"
  max="60"
  step="1"
  value="3"
>

<div class="duration">
  <span class="note">1 second</span>
  <span class="note">60 seconds</span>
</div>

<p class="note" id="cost">
Estimated cost: 72 Magic Hour credits
</p>

<button id="generate">Generate AI Video</button>

<p class="note">
Vertical 9:16 format · 480p · LTX 2.5
<br>
Actual duration and cost depend on Magic Hour model support.
</p>

</div>

<div class="panel">

<h3>Video Preview</h3>

<video id="preview" controls playsinline></video>

<p id="status">Ready to generate.</p>

<a id="download" download="motionmind-video.mp4">
Download Video
</a>

</div>
</div>

<script>
const API="https://jawad-ai-api.jawadraja00999.workers.dev/";

const durationInput=document.getElementById("duration");
const durationValue=document.getElementById("durationValue");
const cost=document.getElementById("cost");

function updateDuration(){
  const seconds=Number(durationInput.value);

  durationValue.textContent=seconds+" seconds";
  cost.textContent=
    "Estimated cost: "+(seconds*24)+" Magic Hour credits";
}

durationInput.addEventListener("input",updateDuration);
updateDuration();

const button=document.getElementById("generate");
const statusBox=document.getElementById("status");
const preview=document.getElementById("preview");
const download=document.getElementById("download");

function status(message){
  statusBox.textContent=message;
}

function getVideoUrl(data){
  const files=data.downloads;

  if(Array.isArray(files)){
    const item=files.find(x=>x.url||x.download_url);
    if(item)return item.url||item.download_url;
  }

  if(typeof files==="string")return files;

  return data.download_url||data.video_url||data.url||null;
}

async function checkStatus(id){
  for(let i=0;i<90;i++){

    await new Promise(resolve=>setTimeout(resolve,4000));

    status("Rendering your video... Please wait.");

    const response=await fetch(
      API+"status?id="+encodeURIComponent(id)
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||"Status check failed.");
    }

    if(data.status==="complete"){
      const videoUrl=getVideoUrl(data);

      if(!videoUrl){
        throw new Error("Video completed, but no download URL was returned.");
      }

      return videoUrl;
    }

    if(data.status==="error"||data.status==="canceled"){
      throw new Error(
        data.error?.message||data.error||"Video generation failed."
      );
    }
  }

  throw new Error("Generation is taking longer than expected.");
}

button.addEventListener("click",async()=>{

  const topic=document.getElementById("topic").value.trim();
  const prompt=document.getElementById("prompt").value.trim();
  const duration=Number(durationInput.value);

  if(!topic||!prompt){
    status("Please enter a topic and scene description.");
    return;
  }

  button.disabled=true;
  download.style.display="none";
  preview.removeAttribute("src");
  preview.load();

  try{

    status("Submitting your video request...");

    const response=await fetch(API+"generate",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        prompt:
          prompt+
          " Topic: "+topic+
          ". Cinematic realistic 3D animation, smooth movement, detailed environment.",
        duration:duration
      })
    });

    const created=await response.json();

    if(!response.ok){
      throw new Error(
        created.error||created.message||"Video request failed."
      );
    }

    const id=
      created.id||
      created.project_id||
      created.project?.id;

    if(!id){
      throw new Error("Project ID missing.");
    }

    status("Request accepted. Project ID: "+id);

    const videoUrl=await checkStatus(id);

    preview.src=videoUrl;
    download.href=videoUrl;
    download.style.display="block";

    status("Your AI video is ready!");

  }catch(error){

    status("Error: "+error.message);

  }finally{

    button.disabled=false;

  }
});
</script>

</body>
</html>
