
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jawad AI Studio Pro</title>

<style>
:root {
  color-scheme: dark;
  --panel:#151d32;
  --line:#293653;
  --text:#eef3ff;
  --muted:#aab6cf;
  --accent:#6d8cff;
}
* {box-sizing:border-box}
body {
  margin:0;
  padding:15px;
  background:linear-gradient(135deg,#0b1020,#111a2e);
  color:var(--text);
  font-family:Arial,sans-serif;
}
.wrap {max-width:900px;margin:auto}
h1 {font-size:27px}
.sub {color:var(--muted)}
.panel {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  margin:13px 0;
}
label {
  display:block;
  font-weight:bold;
  margin:12px 0 7px;
}
textarea,select {
  width:100%;
  background:#0d1528;
  color:white;
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
  font-size:15px;
}
textarea {min-height:145px;line-height:1.5}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
button {
  border:0;
  border-radius:9px;
  background:var(--accent);
  color:white;
  font-weight:bold;
  padding:12px 14px;
  font-size:14px;
  margin:8px 5px 0 0;
}
button.secondary {background:#293653}
button:disabled {opacity:.5}
#status {
  color:#c6d4f5;
  white-space:pre-wrap;
  line-height:1.5;
  margin-top:12px;
}
#preview {
  width:100%;
  aspect-ratio:16/9;
  background:#080d18;
  border-radius:10px;
}
.scene {
  display:grid;
  grid-template-columns:105px 1fr;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.scene img {
  width:105px;
  height:75px;
  object-fit:cover;
  border-radius:8px;
  background:#080d18;
}
.small {font-size:12px;color:var(--muted);margin-top:6px}
.actions {display:flex;flex-wrap:wrap;gap:5px}
@media(max-width:600px) {
  .grid {grid-template-columns:1fr}
  .scene {grid-template-columns:85px 1fr}
  .scene img {width:85px;height:65px}
}
</style>
</head>

<body>
<div class="wrap">

<h1>Jawad AI Studio Pro</h1>
<p class="sub">Create videos with matching images and AI narration.</p>

<div class="panel">

<label>Your video script</label>
<textarea id="script" placeholder="Paste your complete video script here..."></textarea>

<div class="grid">

<div>
<label>Narration language</label>
<select id="language">
<option value="English">English</option>
<option value="Hindi">Hindi</option>
</select>
</div>

<div>
<label>Voice type</label>
<select id="gender">
<option value="female">Female</option>
<option value="male">Male</option>
<option value="all">All voices</option>
</select>
</div>

<div>
<label>Choose AI voice</label>
<select id="voice">
<option value="">Loading voices...</option>
</select>
</div>

<div>
<label>Video format</label>
<select id="ratio">
<option value="16:9">Landscape 16:9</option>
<option value="9:16">Portrait 9:16</option>
</select>
</div>

</div>

<div class="actions">
<button id="loadVoices" class="secondary">Reload voices</button>
<button id="makeScenes">Generate matching images</button>
</div>

<div id="status">Connecting to services...</div>
</div>

<div class="panel">

<label>Video preview</label>
<canvas id="preview" width="1280" height="720"></canvas>

<div class="actions">
<button id="playVoice" class="secondary">Play AI voice</button>
<button id="playPreview">Play video preview</button>
<button id="export">Export / Download video</button>
</div>

<p class="small">Keep this page open while your video is exporting.</p>
</div>

<div class="panel">
<label>Scenes and matching images</label>
<div id="scenes">Your scenes will appear here.</div>
</div>

</div>

<script>
const API = "https://jawad-ai-api.jawadraja00999.workers.dev/";
const $ = id => document.getElementById(id);

let voices = [];
let scenes = [];
let audioBlob = null;
let audioUrl = null;
let audioBuffer = null;
let playingAudio = null;
let previewTimer = null;
let previewIndex = 0;
let imageCache = new Map();

function status(message) {
  $("status").textContent = message;
}

/* Split script into scenes */

function splitIntoScenes(text) {
  const sentences = text.replace(/\s+/g," ").trim()
    .split(/(?<=[.!?])\s+/).filter(Boolean);

  let result = [];

  sentences.forEach(sentence => {
    const words = sentence.split(/\s+/);
    for(let i=0;i<words.length;i+=11) {
      result.push(words.slice(i,i+11).join(" "));
    }
  });

  for(let i=result.length-1;i>0;i--) {
    if(result[i].split(/\s+/).length<=4) {
      result[i-1] += " " + result[i];
      result.splice(i,1);
    }
  }

  return result.slice(0,30);
}

/* Improve image search phrases */

function searchPhrase(sentence) {
  const stop = new Set([
    "the","and","for","with","that","this","from",
    "they","them","their","there","have","has","had",
    "are","was","were","will","would","could","should",
    "you","your","our","his","her","who","what","when",
    "where","why","how","not","but","all","any","than",
    "then","into","about","after","before","because",
    "while","every","each","some","many","more","most",
    "very","just","only","does","did","is","am","be",
    "to","of","in","on","at","by","as","an","a","it",
    "we","i","he","she","or","if","so","up","out"
  ]);

  const words = sentence.toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .split(/\s+/)
    .filter(w=>w.length>2&&!stop.has(w));

  return [...new Set(words)].slice(0,6).join(" ")
    || sentence.slice(0,70);
}

/* Load voices */

async function loadVoices() {
  const select = $("voice");
  select.innerHTML = '<option>Loading voices...</option>';

  try {
    const response = await fetch(API+"?action=voices");
    const data = await response.json();

    if(!response.ok) {
      throw new Error(data.error || "Voice service error");
    }

    if(!Array.isArray(data.voices)) {
      throw new Error("Voice list format is incorrect");
    }

    voices = data.voices;
    fillVoiceOptions();

    status("Loaded "+voices.length+" voices.");

  } catch(error) {
    select.innerHTML = '<option value="">Voice loading failed</option>';
    status("Voice error: "+error.message);
  }
}

function fillVoiceOptions() {
  const wanted = $("gender").value;
  const language = $("language").value.toLowerCase();

  const filtered = voices.filter(v => {
    const gender = (
      v.labels?.gender || v.gender || ""
    ).toLowerCase();

    const locale = (
      v.locale || v.labels?.language || ""
    ).toLowerCase();

    const genderOK = wanted==="all" ||
      !gender || gender===wanted;

    const languageOK = !locale ||
      (language==="hindi"
        ? locale.startsWith("hi")
        : locale.startsWith("en"));

    return genderOK && languageOK;
  });

  const select = $("voice");
  select.innerHTML = "";

  filtered.forEach(v => {
    const option = document.createElement("option");

    option.value = v.voice_id || v.ShortName || v.short_name || v.id || "";
    option.textContent = v.name || v.DisplayName ||
      v.ShortName || v.voice_id || "AI Voice";

    select.appendChild(option);
  });

  if(!filtered.length) {
    select.innerHTML = '<option value="">No matching voices</option>';
  }
}

/* Image search */

async function getImage(query) {
  const searches = [
    query,
    query+" photography",
    query+" documentary photo"
  ];

  for(const term of searches) {
    try {
      const response = await fetch(
        API+"?query="+encodeURIComponent(term)
      );

      const data = await response.json();

      if(response.ok && data.image) {
        return data.image;
      }
    } catch(error) {
      console.log("Image search:",error.message);
    }
  }

  return "";
}

/* Preload images */

function preloadImage(url) {
  if(imageCache.has(url)) return imageCache.get(url);

  const promise = new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = "anonymous";

    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);

    img.src = url;
  });

  imageCache.set(url,promise);
  return promise;
}

/* Generate scenes */

async function generateScenes() {
  const text = $("script").value.trim();

  if(!text) {
    status("Please paste your script first.");
    return;
  }

  scenes = splitIntoScenes(text).map(text => ({
    text,
    query:searchPhrase(text),
    image:"",
    img:null
  }));

  imageCache.clear();

  renderSceneList();

  for(let i=0;i<scenes.length;i++) {
    status("Finding images: "+(i+1)+" / "+scenes.length);

    const image = await getImage(scenes[i].query);

    if(image) {
      const loaded = await preloadImage(image);

      if(loaded) {
        scenes[i].image = image;
        scenes[i].img = loaded;
      }
    }

    updateSceneCard(i);
  }

  drawScene(0);

  const found = scenes.filter(s=>s.img).length;

  status("Finished! "+found+" images loaded out of "+scenes.length+" scenes.");
}

function renderSceneList() {
  const container = $("scenes");
  container.innerHTML = "";

  scenes.forEach((scene,i) => {
    const div = document.createElement("div");
    div.className = "scene";
    div.id = "scene-"+i;

    const img = document.createElement("img");
    img.alt = "Scene "+(i+1);

    const info = document.createElement("div");

    const caption = document.createElement("div");
    caption.textContent = (i+1)+". "+scene.text;

    const small = document.createElement("div");
    small.className = "small";
    small.textContent = "Searching: "+scene.query;

    info.append(caption,small);
    div.append(img,info);
    container.appendChild(div);
  });
}

function updateSceneCard(i) {
  const card = $("scene-"+i);
  if(!card) return;

  const img = card.querySelector("img");
  const small = card.querySelector(".small");

  img.src = scenes[i].image || "";

  small.textContent = scenes[i].img
    ? "Matching image loaded"
    : "Image not found";
}

/* Canvas */

function canvasSize() {
  return $("ratio").value==="9:16"
    ? {w:720,h:1280}
    : {w:1280,h:720};
}

function drawCover(ctx,img,w,h) {
  const scale = Math.max(w/img.width,h/img.height);
  const iw = img.width*scale;
  const ih = img.height*scale;

  ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih);
}

function drawCaption(ctx,text,w,h) {
  const font = Math.round(w*.038);
  ctx.font = "bold "+font+"px Arial";

  const words = text.split(/\s+/);
  const lines = [];
  let line = "";

  words.forEach(word => {
    const test = line ? line+" "+word : word;

    if(ctx.measureText(test).width>w*.86 && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });

  if(line) lines.push(line);

  const shown = lines.slice(0,5);
  const lineH = font*1.35;
  const boxH = shown.length*lineH+42;
  const y = h-boxH-45;

  ctx.fillStyle = "rgba(0,0,0,.72)";
  ctx.fillRect(w*.05,y,w*.9,boxH);

  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";

  shown.forEach((l,j) => {
    ctx.fillText(l,w/2,y+30+font+j*lineH,w*.84);
  });
}

function drawScene(i) {
  if(!scenes.length) return;

  const canvas = $("preview");
  const ctx = canvas.getContext("2d");
  const size = canvasSize();

  if(canvas.width!==size.w || canvas.height!==size.h) {
    canvas.width=size.w;
    canvas.height=size.h;
  }

  const scene = scenes[i%scenes.length];

  ctx.fillStyle = "#101827";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(scene.img) {
    drawCover(ctx,scene.img,canvas.width,canvas.height);
  }

  drawCaption(ctx,scene.text,canvas.width,canvas.height);
}

/* Generate AI voice */

async function makeAudio() {
  const text = $("script").value.trim();
  const voiceId = $("voice").value;

  if(!text) throw new Error("Paste your script first.");
  if(!voiceId) throw new Error("Select a voice first.");

  status("Generating AI narration...");

  const response = await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text,voiceId})
  });

  if(!response.ok) {
    let message = "Voice generation failed: "+response.status;

    try {
      const data = await response.json();
      message = data.detail?.message || data.error || message;
    } catch(e) {}

    throw new Error(message);
  }

  audioBlob = await response.blob();

  if(!audioBlob.size) throw new Error("Audio file is empty.");

  if(audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = URL.createObjectURL(audioBlob);

  const context = new (
    window.AudioContext || window.webkitAudioContext
  )();

  audioBuffer = await context.decodeAudioData(
    await audioBlob.arrayBuffer()
  );

  await context.close();

  status("AI voice generated successfully.");
}

/* Play voice */

async function playVoice() {
  try {
    if(!audioBlob) await makeAudio();

    if(playingAudio) playingAudio.pause();

    playingAudio = new Audio(audioUrl);
    await playingAudio.play();

    status("Playing AI narration.");

  } catch(error) {
    status("Voice error: "+error.message);
  }
}

/* Play preview */

async function playPreview() {
  if(!scenes.length) {
    status("Generate images first.");
    return;
  }

  try {
    if(!audioBlob) await makeAudio();

    if(playingAudio) playingAudio.pause();

    playingAudio = new Audio(audioUrl);
    await playingAudio.play();

    previewIndex=0;
    drawScene(0);

    clearInterval(previewTimer);

    previewTimer=setInterval(() => {
      previewIndex=(previewIndex+1)%scenes.length;
      drawScene(previewIndex);
    },3500);

    playingAudio.onended=()=>clearInterval(previewTimer);

  } catch(error) {
    status("Preview error: "+error.message);
  }
}

/* Download */

function downloadBlob(blob,filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),120000);
}

/* Export video */

async function exportVideo() {
  if(!scenes.length) {
    status("Generate images first.");
    return;
  }

  const canvas=$("preview");

  if(!canvas.captureStream || !window.MediaRecorder) {
    status("Video export needs a browser supporting MediaRecorder. Try updated Chrome.");
    return;
  }

  $("export").disabled=true;

  let audioContext=null;
  let videoStream=null;
  let audioStream=null;
  let combined=null;
  let source=null;
  let recorder=null;

  try {
    if(!audioBuffer) await makeAudio();

    const size=canvasSize();
    canvas.width=size.w;
    canvas.height=size.h;

    audioContext=new (
      window.AudioContext || window.webkitAudioContext
    )();

    await audioContext.resume();

    source=audioContext.createBufferSource();
    source.buffer=audioBuffer;

    const destination=audioContext.createMediaStreamDestination();
    source.connect(destination);

    videoStream=canvas.captureStream(30);
    audioStream=destination.stream;

    combined=new MediaStream([
      ...videoStream.getVideoTracks(),
      ...audioStream.getAudioTracks()
    ]);

    const formats=[
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];

    const mime=formats.find(type=>MediaRecorder.isTypeSupported(type));

    if(!mime) throw new Error("WebM format is not supported.");

    recorder=new MediaRecorder(combined,{mimeType:mime});

    const chunks=[];

    recorder.ondataavailable=e=>{
      if(e.data && e.data.size) chunks.push(e.data);
    };

    const finished=new Promise((resolve,reject)=>{
      recorder.onstop=resolve;
      recorder.onerror=()=>reject(new Error("Recording failed."));
    });

    const duration=audioBuffer.duration;
    const start=performance.now();

    let current=-1;

    function animate() {
      const elapsed=(performance.now()-start)/1000;

      const index=Math.min(
        scenes.length-1,
        Math.floor(elapsed/(duration/scenes.length))
      );

      if(index!==current) {
        current=index;
        drawScene(index);
      }

      if(elapsed<duration) {
        requestAnimationFrame(animate);
      }
    }

    drawScene(0);

    recorder.start(1000);
    source.start();

    status("Video recording started. Keep page open...");

    requestAnimationFrame(animate);

    await new Promise(resolve=>{
      source.onended=resolve;
    });

    if(recorder.state!=="inactive") {
      recorder.stop();
    }

    await finished;

    const blob=new Blob(chunks,{type:"video/webm"});

    if(!blob.size) {
      throw new Error("Video file is empty.");
    }

    downloadBlob(blob,"jawad-ai-studio-video.webm");

    status("Video created! Check your Downloads folder.");

  } catch(error) {
    status("Export error: "+error.message);
  } finally {
    if(source) {
      try {source.stop();} catch(e) {}
    }

    if(videoStream) videoStream.getTracks().forEach(t=>t.stop());
    if(audioStream) audioStream.getTracks().forEach(t=>t.stop());
    if(combined) combined.getTracks().forEach(t=>t.stop());

    if(audioContext) await audioContext.close();

    $("export").disabled=false;
  }
}

/* Buttons */

$("loadVoices").onclick=loadVoices;
$("gender").onchange=fillVoiceOptions;
$("language").onchange=fillVoiceOptions;
$("makeScenes").onclick=generateScenes;
$("playVoice").onclick=playVoice;
$("playPreview").onclick=playPreview;
$("export").onclick=exportVideo;

$("ratio").onchange=()=>{
  if(scenes.length) drawScene(previewIndex);
};

loadVoices();

</script>
</body>
</html>
